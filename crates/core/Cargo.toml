[package]
name = "cookie-monster-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cookie-monster-native-host"
path = "src/bin/native_host.rs"

[dependencies]
aes-gcm = "0.10"
chrono = "0.4"
directories = "6"
rand = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
