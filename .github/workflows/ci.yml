name: CI

on:
  push:
    branches: [main]
  pull_request:

# Public repo uses free GitHub-hosted runners. Status checks are optional
# (branch protection does not require them).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            extensions/chromium/package-lock.json
            apps/desktop/package-lock.json

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cargo fetch
        run: cargo fetch

      - name: Workspace tests
        run: cargo test --workspace

      - name: Chromium extension tests
        run: |
          npm --prefix extensions/chromium ci
          npm --prefix extensions/chromium test

      - name: Fixture server tests
        run: |
          python3 -m unittest fixtures.sites.test_server -v 2>/dev/null \
            || (cd fixtures/sites && python3 -m unittest test_server -v)

      - name: Desktop client unit tests
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml client::

      - name: Build Safari background bundle
        run: |
          npm --prefix extensions/chromium run build:safari
          test -f extensions/safari/background.js
