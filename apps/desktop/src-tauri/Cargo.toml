[package]
name = "cookie-monster-desktop"
version = "0.3.0"
edition = "2021"

# Standalone workspace: keeps the heavy Tauri build out of the root `cargo test`.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[features]
custom-protocol = ["tauri/custom-protocol"]
